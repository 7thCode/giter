<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5" />
      <stop offset="1" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>
  <!-- macOS の慣例に合わせ、外周に約10%の余白を取る -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" />
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)" />
  <!-- チェックの影 -->
  <path d="M322 540 L458 676 L722 392" fill="none" stroke="#1e1b6b" stroke-opacity="0.35" stroke-width="104" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)" transform="translate(0 18)" />
  <!-- チェック(保存) -->
  <path d="M322 540 L458 676 L722 392" fill="none" stroke="#ffffff" stroke-width="104" stroke-linecap="round" stroke-linejoin="round" />
</svg>
